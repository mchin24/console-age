<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Game Console Ages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #4c63d2 0%, #5a67d8 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #666;
        }

        .table-container {
            padding: 2rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        th {
            background: #f8fafc;
            color: #374151;
            font-weight: 600;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #e5e7eb;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:hover {
            background: #f9fafb;
            transition: background-color 0.2s ease;
        }

        .console-name {
            font-weight: 600;
            color: #4c63d2;
        }

        .manufacturer {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .release-date {
            font-family: 'Courier New', monospace;
            background: #f3f4f6;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            display: inline-block;
        }

        .age {
            font-weight: 600;
            color: #059669;
        }

        .age.vintage {
            color: #dc2626;
        }

        .age.retro {
            color: #d97706;
        }

        .age.modern {
            color: #059669;
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: #dc2626;
            background: #fef2f2;
            margin: 2rem;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .table-container {
                padding: 1rem;
            }

            th, td {
                padding: 0.75rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Video Game Console Ages</h1>
            <p class="subtitle">Discover how old your favorite gaming consoles are</p>
        </header>
        
        <div id="loading" class="loading">
            Loading console data...
        </div>
        
        <div id="content" class="table-container" style="display: none;">
        </div>
    </div>

    <script>
        // Load JSON file
        fetch('consoles.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Hide loading indicator
                document.getElementById('loading').style.display = 'none';
                
                // Sort consoles by release year
                data.consoles.sort((a, b) => new Date(a.release_date) - new Date(b.release_date));

                // Get current date
                const currentDate = new Date();
                
                // Create table
                const table = document.createElement('table');
                const headerRow = document.createElement('tr');
                
                // Create table headers
                const headers = ['Console', 'Release Date', 'Age'];
                headers.forEach(headerText => {
                    const header = document.createElement('th');
                    header.textContent = headerText;
                    headerRow.appendChild(header);
                });
                table.appendChild(headerRow);
                
                // Populate table with console data
                data.consoles.forEach(console => {
                    const row = document.createElement('tr');
                    
                    // Console name and manufacturer
                    const nameCell = document.createElement('td');
                    nameCell.innerHTML = `
                        <div class="console-name">${console.name}</div>
                        <div class="manufacturer">${console.manufacturer}</div>
                    `;
                    row.appendChild(nameCell);
                    
                    // Release date
                    const yearCell = document.createElement('td');
                    const releaseDate = new Date(console.release_date);
                    const formattedDate = releaseDate.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short'
                    });
                    yearCell.innerHTML = `<span class="release-date">${formattedDate}</span>`;
                    row.appendChild(yearCell);
                    
                    // Age calculation
                    const ageCell = document.createElement('td');
                    let ageYears = currentDate.getFullYear() - releaseDate.getFullYear();
                    let ageMonths = currentDate.getMonth() - releaseDate.getMonth();
                    
                    if (ageMonths < 0) {
                        ageYears--;
                        ageMonths += 12;
                    }

                    // Add age category class for styling
                    let ageClass = 'modern';
                    if (ageYears > 30) {
                        ageClass = 'vintage';
                    } else if (ageYears > 10) {
                        ageClass = 'retro';
                    }

                    const ageText = ageYears > 0 
                        ? `${ageYears} years, ${ageMonths} months`
                        : `${ageMonths} months`;
                    
                    ageCell.innerHTML = `<span class="age ${ageClass}">${ageText}</span>`;
                    row.appendChild(ageCell);
                    
                    table.appendChild(row);
                });
                
                // Show content and append table
                const contentDiv = document.getElementById('content');
                contentDiv.appendChild(table);
                contentDiv.style.display = 'block';
            })
            .catch(error => {
                console.error('Error loading JSON:', error);
                document.getElementById('loading').style.display = 'none';
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.innerHTML = `
                    <h3>Error Loading Console Data</h3>
                    <p>Unable to load console information. Please check that the consoles.json file is available.</p>
                    <p><small>Error: ${error.message}</small></p>
                `;
                
                document.getElementById('content').appendChild(errorDiv);
                document.getElementById('content').style.display = 'block';
            });
    </script>
</body>
</html>
